name: HubSpot Formular-Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validierung ohne Kontaktanlage
        run: |
          for host in api.hsforms.com api-eu1.hsforms.com; do
            echo "== $host"
            curl -s -o - -w "\nHTTP %{http_code}\n" -X POST "https://$host/submissions/v3/integration/submit/147344461/abb094cd-7326-4ab7-b91c-27a104710244" \
              -H "Content-Type: application/json" -H "Origin: https://vanatma.de" \
              -d '{"fields":[{"objectTypeId":"0-1","name":"email","value":"kein-gueltiger-wert"}],"legalConsentOptions":{"consent":{"consentToProcess":true,"text":"Test"}}}'
            echo "-- CORS preflight"
            curl -s -o /dev/null -D - -X OPTIONS "https://$host/submissions/v3/integration/submit/147344461/abb094cd-7326-4ab7-b91c-27a104710244" \
              -H "Origin: https://vanatma.de" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | grep -i -E "^HTTP|access-control"
          done
