  - slug: ihht
    group: koerper
    person: beide
    title: IHHT Zelltraining
    badge: Neu
    short: Höhentraining im Liegen, ein sanfter Trainingsreiz für deine Mitochondrien.
    lead: Entspannt liegen und abwechselnd sauerstoffärmere und sauerstoffreichere Luft atmen, wie ein Ausflug in die Berge für deine Zellen.
    image: angebot-ihht.jpg
    chart: o2
    seo_title: IHHT in Sankt Englmar · Zelltraining im Bayerischen Wald
    seo_description: IHHT Intervall-Hypoxie-Hyperoxie-Training in Sankt Englmar im Bayerischen Wald. Sanftes Zelltraining im Liegen für deine Mitochondrien, mit ärztlichem Erstgespräch.
    intro:
      - "**IHHT, das Intervall-Hypoxie-Hyperoxie-Training,** ist ein Zelltraining, bei dem sich Phasen mit reduziertem Sauerstoff und Phasen mit erhöhtem Sauerstoff abwechseln. Man könnte es auch Höhentraining im Liegen nennen."
      - In den sauerstoffärmeren Phasen atmest du Luft mit etwa 10 bis 15 Prozent Sauerstoff, ähnlich wie in mehreren tausend Metern Höhe. In den sauerstoffreichen Phasen erhältst du Luft mit etwa 30 bis 40 Prozent. Die normale Raumluft enthält rund 21 Prozent.
      - Ein Sensor am Finger misst laufend deine Sauerstoffsättigung und deinen Puls. Das Gerät passt die Intervalle in Echtzeit an deine Werte an, so bleibt das Training jederzeit in deinem persönlichen Wohlfühlbereich.
    sections:
      - title: Mitochondrien, die Kraftwerke deiner Zellen
        text:
          - In fast jeder deiner Zellen arbeiten Hunderte bis Tausende Mitochondrien. Sie gewinnen aus Sauerstoff und Nährstoffen die Energie, die dein Körper für Bewegung, Denken und Regeneration braucht.
          - IHHT nutzt ein Prinzip, das in der Longevity-Forschung **Hormesis** heißt. Ein kurzer, gut dosierter Reiz regt den Körper zur Anpassung an. Der Wechsel zwischen wenig und viel Sauerstoff ist ein sanfter Trainingsreiz für deine Mitochondrien und soll zwei natürliche Prozesse unterstützen, das Aussortieren schwächerer Mitochondrien und die Bildung neuer, leistungsfähiger.
    points:
      - Rund 45 Minuten pro Sitzung, entspannt im Liegen
      - Bewährt sind regelmäßige Sitzungen, bis zu zweimal pro Woche
      - Sauerstoffsättigung und Puls werden laufend überwacht
      - Nach der Sitzung bist du sofort wieder alltagsbereit
    steps:
      - title: "Ärztliches Erstgespräch"
        who: "Steffi"
        text: "Anamnese und Gesundheits-Check bei Dr. med. Stefanie Klappenberger. Gemeinsam klärt ihr, ob IHHT zu dir passt."
      - title: "Eingangstest"
        text: "Ein kurzer Hypoxietest zeigt, wie dein Körper auf weniger Sauerstoff reagiert. Daraus entsteht dein persönliches Programm."
      - title: "Deine Sitzungen"
        who: "Stephan"
        text: "Ab deinem zweiten Besuch empfängt dich Stephan, startet dein Programm und begleitet jede Sitzung. Du ruhst, hörst Musik oder gehst einfach in die Stille."
      - title: "Verlaufsgespräch"
        text: "Gemeinsam schauen wir auf deine Entwicklung und darauf, wie du die neue Energie im Alltag hältst."
    faq:
      - q: "Wer begleitet mich bei IHHT?"
        a: "Dein Einstieg ist immer ein ärztliches Erstgespräch mit Anamnese bei Dr. med. Stefanie Klappenberger. Ab deinem zweiten Besuch empfängt dich Stephan und begleitet jede Sitzung."
      - q: "Wie fühlt sich eine Sitzung an?"
        a: "Die meisten empfinden IHHT als angenehm und entspannend, ähnlich wie eine Ruhepause. In den sauerstoffärmeren Phasen spürst du manchmal ein leichtes Kribbeln oder einen etwas schnelleren Puls, so wie bei einem Spaziergang in den Bergen."
      - q: "Was kostet IHHT?"
        a: "Die Kosten für dein IHHT-Programm besprechen wir persönlich im Erstgespräch, abgestimmt auf deine Ziele und die Anzahl der Sitzungen."
      - q: "Erstattet die Krankenversicherung IHHT?"
        a: "Manche private Krankenversicherungen erstatten IHHT-Anwendungen ganz oder teilweise, abhängig vom Tarif. Frag am besten vorab bei deiner Versicherung nach."
      - q: "Wann sollte ich vorab Bescheid geben?"
        a: "Bitte sprich uns im Erstgespräch an bei Schwangerschaft, akuten Infekten oder Fieber, nach Herzinfarkt oder Schlaganfall, bei schweren Herzrhythmusstörungen, unbehandeltem Bluthochdruck, Epilepsie, akuter Thrombose, schweren Lungenerkrankungen oder laufender Krebstherapie. Dann finden wir gemeinsam den passenden Weg."
    note: IHHT ist eine Begleitung für dein Wohlbefinden und ergänzt eine ärztliche Behandlung.

  - slug: eigenbluttherapie
    group: koerper
    person: steffi
    title: Eigenbluttherapie
    short: Ein bewährtes Verfahren der Naturmedizin, individuell und ärztlich begleitet.
    lead: Impulse aus deinem eigenen Körper, mit Zeit, Sorgfalt und ärztlicher Erfahrung.
    image: angebot-eigenblut.jpg
    seo_title: Eigenbluttherapie in Sankt Englmar · VanAtma
    seo_description: Eigenbluttherapie bei Ärztin Dr. med. Stefanie Klappenberger in Sankt Englmar im Bayerischen Wald. Ein bewährtes Verfahren der Naturmedizin, individuell abgestimmt.
    intro:
      - Die Eigenbluttherapie gehört zu den klassischen Verfahren der Naturmedizin. Dabei wird eine kleine Menge deines Blutes entnommen und dir aufbereitet wieder zurückgegeben.
      - Wie die Behandlung für dich gestaltet wird, stimmt Dr. med. Stefanie Klappenberger nach einer ausführlichen Anamnese individuell mit dir ab. Gern verbindest du sie mit weiteren Angeboten der Praxis, zum Beispiel mit IHHT oder Akupunktur.
    points:
      - Ausführliches ärztliches Vorgespräch
      - Individuell abgestimmter Ablauf
      - Ruhige Atmosphäre mit Zeit für deine Fragen
    faq:
      - q: "Wie läuft eine Eigenbluttherapie ab?"
        a: "Nach dem ärztlichen Vorgespräch wird eine kleine Menge Blut entnommen, aufbereitet und zurückgegeben. Dauer und Anzahl der Termine besprecht ihr individuell."
      - q: "Für wen ist sie geeignet?"
        a: "Das klärt Steffi im persönlichen Gespräch mit dir, abgestimmt auf deine Gesundheit und deine Wünsche."

  - slug: akupunktur
    group: koerper
    person: steffi
    title: Akupunktur
    short: Feine Nadeln, sanfte Impulse zur Regulation, ärztlich durchgeführt.
    lead: Ein bewährtes Verfahren der Traditionellen Chinesischen Medizin, mit Zeit und ärztlicher Sorgfalt.
    image: angebot-akupunktur.jpg
    seo_title: Akupunktur in Sankt Englmar · Ärztin im Bayerischen Wald
    seo_description: Akupunktur bei Ärztin Dr. med. Stefanie Klappenberger in Sankt Englmar. Feine Nadeln, sanfte Impulse zur Regulation und tiefe Entspannung im Bayerischen Wald.
    intro:
      - Akupunktur ist ein jahrtausendealtes Verfahren der Traditionellen Chinesischen Medizin. Feine Nadeln an ausgewählten Punkten geben deinem Körper sanfte Impulse zur Regulation und laden zu tiefer Entspannung ein.
      - Dr. med. Stefanie Klappenberger behandelt Frauen und Männer in allen Lebensphasen. Vor der ersten Behandlung nehmt ihr euch Zeit für ein ausführliches Gespräch, damit die Akupunktur zu dir und deinem Anliegen passt.
    points:
      - Ärztlich durchgeführt, mit ausführlichem Vorgespräch
      - Feinste Einmalnadeln
      - Rund 30 bis 45 Minuten Ruhe pro Sitzung
    faq:
      - q: "Tut Akupunktur weh?"
        a: "Die Nadeln sind sehr fein. Die meisten spüren beim Setzen nur einen kurzen Moment, danach überwiegt die Entspannung."
      - q: "Wie viele Sitzungen sind sinnvoll?"
        a: "Das hängt von deinem Anliegen ab. Oft sind mehrere Sitzungen im Abstand von einer Woche bewährt. Steffi bespricht das mit dir."
      - q: "Ist Akupunktur auch in der Schwangerschaft möglich?"
        a: "Ja, nach ärztlicher Rücksprache begleitet Steffi auch werdende Mütter achtsam mit Akupunktur."

  - slug: sanfte-aesthetik
    group: koerper
    person: steffi
    title: Sanfte Ästhetik
    short: Natürlich frisch, behutsam und ärztlich, zum Beispiel mit Eigenblut.
    lead: Natürlich frisch aussehen und dich in deiner Haut wohlfühlen.
    image: angebot-aesthetik.jpg
    seo_title: Sanfte Ästhetik in Sankt Englmar · Ärztliche Faltenbehandlung
    seo_description: Sanfte ästhetische Medizin bei Ärztin Dr. med. Stefanie Klappenberger in Sankt Englmar, zum Beispiel Faltenunterspritzung mit Eigenblut. Natürlich und behutsam.
    intro:
      - Schönheit entsteht für uns dort, wo du dich wohlfühlst. Deshalb steht bei unserer ästhetischen Medizin ein natürliches Ergebnis im Mittelpunkt, das deinen Ausdruck bewahrt.
      - Dr. med. Stefanie Klappenberger bietet ärztliche Faltenbehandlungen an, zum Beispiel die Faltenunterspritzung mit Eigenblut. Welche Methode zu dir passt, klärt ihr in Ruhe im persönlichen ärztlichen Gespräch.
    points:
      - Ausführliche ärztliche Beratung vor jeder Behandlung
      - Behutsames Vorgehen mit Blick auf ein natürliches Ergebnis
      - Ehrliche Einschätzung, was zu dir passt
    faq:
      - q: "Welche Methoden gibt es?"
        a: "Das besprecht ihr im persönlichen ärztlichen Gespräch. Steffi berät dich ausführlich zu allen Möglichkeiten und zu dem, was zu dir passt."
      - q: "Kann ich Ästhetik mit anderen Angeboten verbinden?"
        a: "Sehr gern, zum Beispiel mit Microneedling mit Eigenblut oder IHHT."

  - slug: microneedling
    group: koerper
    person: steffi
    title: Microneedling mit Eigenblut
    short: Feinste Nadeln und das Serum aus deinem eigenen Blut für ein frisches Hautbild.
    lead: Feine Impulse für ein frisches, natürliches Hautbild, mit dem Serum aus deinem eigenen Blut.
    image: angebot-microneedling.jpg
    seo_title: Microneedling mit Eigenblut in Sankt Englmar · VanAtma
    seo_description: Microneedling mit Eigenblutserum bei Ärztin Dr. med. Stefanie Klappenberger in Sankt Englmar im Bayerischen Wald. Für ein frisches, natürliches Hautbild.
    intro:
      - Beim Microneedling setzen feinste Nadeln sanfte Impulse in der Haut. Bei uns wird dabei das Serum eingearbeitet, das aus deinem eigenen Blut gewonnen wird.
      - So verbindest du eine bewährte Methode der ästhetischen Medizin mit der Kraft deines eigenen Körpers. Die Behandlung führt Dr. med. Stefanie Klappenberger durch, mit Zeit für Beratung und Pflegetipps für die Tage danach.
    points:
      - Ärztlich durchgeführt, mit Vorgespräch
      - Serum aus deinem eigenen Blut
      - Pflegetipps für die Zeit nach der Behandlung
    faq:
      - q: "Wie lange dauert eine Behandlung?"
        a: "Mit Vorbereitung, Blutentnahme und Behandlung solltest du rund eine Stunde einplanen."
      - q: "Wie sieht die Haut danach aus?"
        a: "Eine leichte Rötung ist in den ersten Stunden bis Tagen üblich. Steffi gibt dir passende Pflegetipps mit."

