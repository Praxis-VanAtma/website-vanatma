  - slug: hypnose
    group: seele
    person: stephan
    title: Hypnose
    short: Die Kunst, nach innen zu lauschen, für neue Perspektiven und innere Ruhe.
    lead: Eine bewusste Trance, in der du dir selbst begegnest.
    image: angebot-hypnose.jpg
    seo_title: Hypnose in Sankt Englmar · VanAtma im Bayerischen Wald
    seo_description: Hypnose mit Stephan Dietl in Sankt Englmar. Eine bewusste Trance für persönliche Entwicklung, neue Perspektiven und innere Ruhe im Bayerischen Wald.
    intro:
      - Hypnose bedeutet für uns, die Welt draußen leiser werden zu lassen und der eigenen inneren Stimme zu lauschen. In einem entspannten, fokussierten Zustand zwischen Wachen und Schlafen öffnet sich der Zugang zu deinen inneren Ressourcen.
      - Stephan Dietl arbeitet mit Stimme, Atem und inneren Bildern. Vertrauen steht dabei an erster Stelle, du behältst jederzeit die Kontrolle. Hypnose ist eine Einladung, du entscheidest, wie weit du gehst.
    points:
      - Ausführliches Vorgespräch zu deinem Anliegen
      - Entspannte Trance mit Stimme, Atem und inneren Bildern
      - Impulse für Morgen- und Abendroutinen im Alltag
    faq:
      - q: "Verliere ich in Hypnose die Kontrolle?"
        a: "Du bleibst jederzeit wach für das, was geschieht, und kannst die Trance selbst beenden. Hypnose ist eine Einladung, die du jederzeit selbst gestaltest."
      - q: "Wofür eignet sich Hypnose?"
        a: "Zum Beispiel für tiefe Entspannung, mehr innere Ruhe, neue Perspektiven und persönliche Veränderungswünsche. Im Vorgespräch klärt ihr, ob sie zu deinem Anliegen passt."
    note: Schamanische Begleitung, Energiearbeit und Hypnose sind Angebote für dein Wohlbefinden und deine persönliche Entwicklung. Sie stellen keine Diagnosen und ersetzen keine ärztliche oder psychotherapeutische Behandlung.

