  - slug: schamanische-begleitung
    group: seele
    person: stephan
    title: Schamanische Begleitung
    short: Seelenrückholung, Bändertrennung, Trommelreisen und Rituale.
    lead: Ein alter Weg zu innerer Verbundenheit und Ganzheit, getragen von der Stille des Waldes.
    image: angebot-schamanisch.jpg
    seo_title: Schamanische Begleitung in Sankt Englmar · Seelenrückholung
    seo_description: Schamanische Begleitung mit Stephan Dietl in Sankt Englmar im Bayerischen Wald. Seelenrückholung, Bändertrennung, Trommelreisen, Rituale und Räucherungen.
    intro:
      - Schamanische Arbeit ist für uns ein Weg zurück zu dir selbst, mitten im Leben. Sie lädt dich ein, dich wieder mit deiner eigenen Kraft und mit der Natur zu verbinden.
      - Stephan Dietl begleitet dich mit Trommelreisen, Ritualen und Räucherungen in einem geschützten Raum. Je nach Anliegen arbeitet er mit **Seelenrückholung**, bei der verlorene Seelenanteile zu dir zurückkehren dürfen, und mit **Bändertrennung**, bei der sich alte energetische Verbindungen lösen.
    points:
      - Seelenrückholung
      - Bändertrennung
      - Trommelreisen und Rituale
      - Räucherungen im Rhythmus der Natur
    steps:
      - title: "Kennenlernen"
        text: "Ein erstes Gespräch darüber, was dich zu uns führt und wonach deine Seele ruft."
      - title: "Deine Sitzung"
        text: "Ein geschützter Raum mit Trommel, Ritual und Stille, in dem du in deinem Tempo ankommen kannst."
      - title: "Integration"
        text: "Impulse für deinen Alltag, damit das Erlebte weiterwirkt."
    faq:
      - q: "Was ist eine Seelenrückholung?"
        a: "Im schamanischen Verständnis können sich in belastenden Lebensphasen Anteile unserer Seele zurückziehen. In der Seelenrückholung werden sie eingeladen, zu dir zurückzukehren."
      - q: "Was bedeutet Bändertrennung?"
        a: "Zwischen Menschen entstehen energetische Verbindungen. Bei der Bändertrennung lösen sich Verbindungen, die dich heute eher Kraft kosten, damit du freier weitergehen kannst."
    note: Schamanische Begleitung, Energiearbeit und Hypnose sind Angebote für dein Wohlbefinden und deine persönliche Entwicklung. Sie stellen keine Diagnosen und ersetzen keine ärztliche oder psychotherapeutische Behandlung.

  - slug: reiki
    group: seele
    person: stephan
    title: Feine Energiearbeit (Reiki)
    short: Stille, sanfte Berührung und Raum zum Auftanken, mit Reiki-Meister Stephan.
    lead: Im Stillwerden beginnt die Kraft von Reiki.
    image: angebot-reiki.jpg
    seo_title: Reiki in Sankt Englmar · Feine Energiearbeit im Bayerischen Wald
    seo_description: Reiki und feine Energiearbeit mit Reiki-Meister Stephan Dietl in Sankt Englmar. Ein geschützter Raum zum Ankommen, Entspannen und Auftanken, ergänzt durch Pendel und Tensor.
    intro:
      - Reiki ist für uns weniger eine Technik als ein stiller Akt der Fürsorge. Durch sanftes Auflegen der Hände entsteht ein geschützter Raum, in dem dein System zur Ruhe kommt und du neue Kraft schöpfst.
      - Viele erleben dabei Wärme, innere Bilder oder eine tiefe, nachklingende Ruhe. Stephan Dietl ist Reiki-Meister und ergänzt die Energiearbeit je nach Anliegen durch die Arbeit mit Pendel und Tensor.
    points:
      - Sanftes Auflegen der Hände, bekleidet und entspannt im Liegen
      - Ergänzt durch Pendel und Tensor
      - Gut kombinierbar mit anderen Angeboten der Praxis
    faq:
      - q: "Muss ich für Reiki etwas können?"
        a: "Du darfst einfach da sein, liegen und geschehen lassen. Alles Weitere ergibt sich in der Sitzung."
      - q: "Wie lange dauert eine Sitzung?"
        a: "Rechne mit rund 60 Minuten inklusive Vor- und Nachgespräch."
    note: Schamanische Begleitung, Energiearbeit und Hypnose sind Angebote für dein Wohlbefinden und deine persönliche Entwicklung. Sie stellen keine Diagnosen und ersetzen keine ärztliche oder psychotherapeutische Behandlung.

