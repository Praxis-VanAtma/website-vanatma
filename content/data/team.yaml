stephan:
  slug: stephan-dietl
  published: true
  image: team-stephan.jpg
  eyebrow: Seele und Bewusstsein
  quote: "Das größte Abenteuer liegt in uns selbst."
  lead: Ich begleite Menschen auf ihrer Reise zu sich selbst, mit schamanischer Arbeit, feiner Energiearbeit und Hypnose, mitten in der Stille des Bayerischen Waldes.
  story:
    - Mein Weg war nie eine gerade Linie. Viele Jahre stand ich als Profimusiker auf großen Bühnen im ganzen deutschsprachigen Raum. Musik hat mich gelehrt, wie sehr Klang, Rhythmus und echte Begegnung Menschen berühren können.
    - Danach habe ich über zwanzig Jahre in Vertrieb und Partnermanagement internationaler IT-Unternehmen gearbeitet. Dort durfte ich erleben, was Menschen in Zeiten von Veränderung brauchen, als Führungskraft, im Team und ganz persönlich. Kommunikation, Vertrauen und gute Beziehungen waren immer der Schlüssel.
    - Der Weg nach innen begleitet mich dabei schon mein ganzes Leben. Mit Anfang zwanzig habe ich mit Reiki begonnen, später kamen die schamanische Arbeit, NLP und Hypnose dazu. Die Natur, die Stille und das Trommeln sind für mich Quellen, aus denen ich selbst immer wieder Kraft schöpfe.
    - Mit VanAtma haben Steffi und ich diese Wege zusammengeführt. „Van“ steht für Bewegung, Reise und Freiheit, „Atma“ für die Seele. Unsere Praxis ist ein Ort für diese Reise. Auf unserem YouTube-Kanal VanAtma nehmen wir dich mit auf unsere Reisen, und nach und nach kommen dort auch Trommelreisen, Meditationen und Impulse aus dem Bayerischen Wald dazu.
  qualifications:
    - Schamanische Ausbildung bei Klaus Ruhland, Home of the Spirit
    - Reiki-Meister
    - NLP Master und Coach nach Richard Bandler
    - Weiterbildungen in Potenzial- und Persönlichkeitsentwicklung
    - Ausbildung in Hypnose (laufend)
    - Ausbildung zum Rückführungsleiter (laufend)
  video_title: Unterwegs mit VanAtma
  video_text: Auf unserem YouTube-Kanal VanAtma teilen Steffi und ich unsere Reisen und das Gefühl von Freiheit unterwegs. Nach und nach wächst der Kanal um Trommelreisen, Meditationen und Momente aus dem Bayerischen Wald.
  youtube_id: "mNzPysuxLfE"
  note: Schamanische Begleitung, Energiearbeit und Hypnose sind Angebote für Wohlbefinden und persönliche Entwicklung. Sie stellen keine Diagnosen und ersetzen keine ärztliche oder psychotherapeutische Behandlung.

