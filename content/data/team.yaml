stephan:
  slug: stephan-dietl
  published: true
  image: team-stephan.jpg
  eyebrow: Seele und Bewusstsein
  quote: "Das größte Abenteuer liegt in uns selbst."
  lead: Ich begleite Menschen auf ihrer Reise zu sich selbst, mit schamanischer Arbeit, feiner Energiearbeit und Hypnose, mitten in der Stille des Bayerischen Waldes.
  story:
    - Mein Weg war nie eine gerade Linie. Viele Jahre stand ich als Profimusiker auf großen Bühnen im ganzen deutschsprachigen Raum. Musik hat mich gelehrt, wie sehr Klang, Rhythmus und echte Begegnung Menschen berühren können.
    - Danach habe ich über zwanzig Jahre in Vertrieb und Partnermanagement internationaler IT-Unternehmen gearbeitet. Dort durfte ich erleben, was Menschen in Zeiten von Veränderung brauchen, als Führungskraft, im Team und ganz persönlich. Kommunikation, Vertrauen und gute Beziehungen waren immer der Schlüssel.
    - Der Weg nach innen begleitet mich dabei schon mein ganzes Leben. Mit Anfang zwanzig habe ich mit Reiki begonnen, später kamen die schamanische Arbeit, NLP und Hypnose dazu. Die Natur, die Stille und das Trommeln sind für mich Quellen, aus denen ich selbst immer wieder Kraft schöpfe.
    - Mit VanAtma haben Steffi und ich diese Wege zusammengeführt. „Van“ steht für Bewegung, Reise und Freiheit, „Atma“ für die Seele. Unsere Praxis ist ein Ort für diese Reise. Auf unserem YouTube-Kanal VanAtma nehmen wir dich mit auf unsere Reisen, und nach und nach kommen dort auch Trommelreisen, Meditationen und Impulse aus dem Bayerischen Wald dazu.
  qualifications:
    - Schamanische Ausbildung bei Klaus Ruhland, Home of the Spirit
    - Reiki-Meister
    - NLP Master und Coach nach Richard Bandler
    - Weiterbildungen in Potenzial- und Persönlichkeitsentwicklung
    - Ausbildung in Hypnose (laufend)
    - Ausbildung zum Rückführungsleiter (laufend)
  gallery_eyebrow: Ein bisschen privat
  gallery_title: Abseits der Praxis
  gallery_text: Ein paar Momente aus meinem Leben, mit Musik, Natur, Reisen und den Menschen und Tieren, die mir am Herzen liegen.
  gallery:
    - {file: stephan-musik.jpg, caption: "Musik begleitet mich seit jeher", alt: "Stephan spielt E-Gitarre"}
    - {file: stephan-wandern.jpg, caption: "Mit Steffi unterwegs im Wald", alt: "Stephan und Steffi auf einem Waldweg am Bach"}
    - {file: stephan-van.jpg, caption: "Zuhause auf Rädern", alt: "Stephan genießt die Sonne vor dem VanAtma-Van"}
    - {file: stephan-katze.jpg, caption: "Kleine Seelen, große Freude", alt: "Stephan mit einem kleinen Kätzchen"}
    - {file: stephan-tracht.jpg, caption: "Daheim im Bayerischen Wald", alt: "Stephan und Steffi in Tracht"}
  video_title: Unterwegs mit VanAtma
  video_text: Auf unserem YouTube-Kanal VanAtma teilen Steffi und ich unsere Reisen und das Gefühl von Freiheit unterwegs. Nach und nach wächst der Kanal um Trommelreisen, Meditationen und Momente aus dem Bayerischen Wald.
  youtube_id: "mNzPysuxLfE"
  note: Schamanische Begleitung, Energiearbeit und Hypnose sind Angebote für Wohlbefinden und persönliche Entwicklung. Sie stellen keine Diagnosen und ersetzen keine ärztliche oder psychotherapeutische Behandlung.

steffi:
  slug: stefanie-klappenberger
  published: false
  image: team-steffi.jpg
  eyebrow: Ärztin für Körper und Medizin
  quote: "Für jeden Menschen gibt es einen passenden Weg."
  lead: Als Fachärztin verbinde ich die Sorgfalt der Schulmedizin mit Naturmedizin, Akupunktur und einem ganzheitlichen Blick auf ein langes, gesundes Leben.
  story:
    - Die Medizin begleitet mich mein ganzes Berufsleben. Studiert habe ich in Regensburg und München, und schon während des Studiums habe ich meine Ausbildung in Akupunktur begonnen. Meine Facharztausbildung begann mit zwei Jahren in der Chirurgie in München, danach folgten die Frauenheilkunde und Geburtshilfe am Caritas-Krankenhaus in Regensburg und in Starnberg.
    - Von Juli 2012 bis Ende 2025 hatte ich meine eigene Frauenarztpraxis in München. Über dreizehn Jahre durfte ich dort Frauen in allen Lebensphasen begleiten, bei Vorsorge, Kinderwunsch, Schwangerschaft und weit darüber hinaus.
    - Heute bin ich zurück im Bayerischen Wald. Dienstags und mittwochs bin ich weiterhin als Frauenärztin im MVZ in Viechtach für meine Patientinnen da, eine Arbeit, die mir viel Freude schenkt. In unserer Praxis VanAtma widme ich mich der Naturmedizin, der Akupunktur und der Longevity-Medizin, also allem, was ein langes, gesundes Leben unterstützt.
    - Inspiriert hat mich dabei vor allem Stephan mit seinem gesunden Lebensstil. Wir machen gemeinsam Yoga und führen viele spirituelle Gespräche, und so ist auch mein Blick auf die Medizin nach und nach weiter geworden.
    - Ich helfe von Herzen gern und sehe das Glas immer halb voll. Ich glaube fest daran, dass wir vieles schaffen, wenn wir es wirklich möchten, und dass es für jede Herausforderung eine passende Lösung gibt. Mit dieser Zuversicht begleite ich dich, Schritt für Schritt.
  qualifications:
    - Fachärztin für Frauenheilkunde und Geburtshilfe
    - Über dreizehn Jahre eigene Frauenarztpraxis in München
    - Akupunktur, Ausbildung seit dem Studium
    - Ästhetische Medizin
  gallery_eyebrow: Ein bisschen privat
  gallery_title: Abseits der Praxis
  gallery_text: Kraft schöpfe ich draußen, beim Wandern, Joggen, Golfen und Tennisspielen. Besonders genieße ich die Reisen mit Stephan in unserer Atma und die Spaziergänge mit unserer jungen Hündin Josefine.
  gallery:
    - {file: stephan-wandern.jpg, caption: "Unterwegs im Wald", alt: "Steffi und Stephan auf einem Waldweg am Bach"}
    - {file: stephan-tracht.jpg, caption: "Daheim im Bayerischen Wald", alt: "Steffi und Stephan in Tracht"}
  note: ""
