# Archetypen-Kreis – zwölf Archetypen nach Carol S. Pearson, eigene Situationen.
# Auswertung: „am ehesten“ +2, „am wenigsten“ −1.
# Teil 1 (18 Fragen, „So bin ich“): jeder Archetyp genau sechsmal → gelebte Archetypen und Phase.
# Teil 2 (6 Fragen, part: sehnsucht): jeder Archetyp genau zweimal → rufender Archetyp.
# Reihenfolge der Archetypen = Reihenfolge im Rad (je vier pro Phase: Vorbereitung, Reise, Rückkehr).

phases:
  - name: Vorbereitung
    text: "Du bist gerade in der Phase der Vorbereitung. Es geht darum, Wurzeln zu schlagen und Vertrauen, Halt und Kraft für deinen Weg zu sammeln."
    motto: Wurzeln schlagen
    color: "#c9b48a"
  - name: Reise
    text: "Du bist gerade mitten auf der Reise. Es geht darum, dich selbst zu finden: aufzubrechen, Altes zu wandeln, zu lieben und Neues zu erschaffen."
    motto: Dich selbst finden
    color: "#8fae8a"
  - name: Rückkehr
    text: "Du bist gerade in der Phase der Rückkehr. Es geht darum, dein Licht zu teilen: Verantwortung zu tragen, weiterzugeben, was du gelernt hast, und das Leben zu feiern."
    motto: Dein Licht teilen
    color: "#a99bc4"

archetypes:
  - id: unschuldiger
    motto: Vertrauen ins Leben
    icon: sun
    name: Unschuldiger
    phase: Vorbereitung
    stone: Bergkristall
    color: "#cfd8dc"
    essence: Du begegnest dem Leben mit Vertrauen und einem offenen Herzen.
    drive: Vertrauen und Geborgenheit
    gift: Zuversicht und Optimismus. Du siehst das Gute und steckst andere damit an.
    shadow: Wenn es schwer wird, schaust du manchmal lieber weg.
    question: Wo darf ich heute einfach vertrauen?
    invite: Schenk dir jeden Tag einen Moment kindlicher Freude und Zuversicht.
  - id: weggefaehrte
    motto: Gemeinsam stark
    icon: rings
    name: Weggefährte
    alt: Waise
    phase: Vorbereitung
    stone: Achat
    color: "#a07a52"
    essence: Du weißt, wie wertvoll Zusammenhalt ist, und stehst mit beiden Beinen auf der Erde.
    drive: Zugehörigkeit und Verbundenheit
    gift: Mitgefühl und Bodenhaftung. Bei dir fühlen sich Menschen verstanden.
    shadow: In schweren Zeiten kann das Gefühl wachsen, allein dazustehen.
    question: Wer geht meinen Weg mit mir?
    invite: Bitte jemanden um Unterstützung und genieße das Miteinander.
  - id: krieger
    motto: Mutig einstehen
    icon: shield
    name: Krieger
    alt: Held
    phase: Vorbereitung
    stone: Karneol
    color: "#c0532f"
    essence: Du setzt dich mutig für das ein, was dir wichtig ist.
    drive: Mut und Durchsetzung
    gift: Entschlossenheit und Disziplin. Du bringst Dinge ins Ziel und schützt, was dir am Herzen liegt.
    shadow: Manchmal wird aus Stärke Härte, gegen andere oder gegen dich selbst.
    question: Wofür lohnt es sich für mich einzustehen?
    invite: Setz dir ein kleines, klares Ziel und geh es heute entschlossen an.
  - id: fuersorgender
    motto: Für andere da sein
    icon: bowl
    name: Fürsorgender
    phase: Vorbereitung
    stone: Rosenquarz
    color: "#e2a6ad"
    essence: Du schenkst anderen Wärme, Halt und Zuwendung.
    drive: Für andere da sein
    gift: Großzügigkeit und Wärme. In deiner Nähe blühen Menschen auf.
    shadow: Dabei gerätst du selbst leicht aus dem Blick.
    question: Wie sorge ich heute auch für mich?
    invite: Schenk heute jemandem bewusst eine kleine Freundlichkeit, und dir selbst ebenso.
  - id: entdecker
    motto: Neugierig aufbrechen
    icon: compass
    name: Entdecker
    alt: Suchender
    phase: Reise
    stone: Türkis
    color: "#3e9c96"
    essence: Du folgst deiner Neugier und suchst den Weg, der wirklich deiner ist.
    drive: Freiheit und das eigene Selbst finden
    gift: Neugier und Unabhängigkeit. Du öffnest Türen zu neuen Welten.
    shadow: Die Sehnsucht nach dem Nächsten kann rastlos machen.
    question: Wonach sehnt sich meine Seele gerade?
    invite: Geh einen ganz neuen Weg, mit offenen Sinnen und frei im Herzen.
  - id: rebell
    motto: Altes loslassen
    icon: bolt
    name: Rebell
    alt: Zerstörer
    phase: Reise
    stone: Onyx
    color: "#3b3a3f"
    essence: Du hast den Mut, loszulassen und Altes zu verwandeln.
    drive: Loslassen und Wandlung
    gift: Mut zur Veränderung. Du räumst auf und schaffst Raum für Neues.
    shadow: Manchmal reißt du ein, was dich noch tragen könnte.
    question: Was darf in meinem Leben gehen?
    invite: Verabschiede bewusst eine Sache, die ausgedient hat.
  - id: liebender
    motto: Mit Hingabe leben
    icon: heart
    name: Liebender
    phase: Reise
    stone: Granat
    color: "#8e2a3c"
    essence: Du lebst mit Hingabe und spürst tiefe Verbundenheit.
    drive: Nähe und Hingabe
    gift: Leidenschaft und Herzensverbindung. Du schenkst dem Leben Schönheit und Wärme.
    shadow: In der Nähe zu anderen kannst du dich selbst verlieren.
    question: Wem oder was schenke ich mein Herz?
    invite: Genieße heute etwas mit allen Sinnen, Musik, Essen, Natur oder einen lieben Menschen.
  - id: schoepfer
    motto: Neues erschaffen
    icon: spiral
    name: Schöpfer
    phase: Reise
    stone: Citrin
    color: "#e0b23c"
    essence: Du bringst Neues in die Welt und gibst ihm deine Handschrift.
    drive: Etwas Eigenes erschaffen
    gift: Kreativität und Vision. Aus Ideen wird bei dir Wirklichkeit.
    shadow: Der eigene Anspruch kann zu Perfektionismus werden.
    question: Was möchte durch mich in die Welt?
    invite: Erschaffe etwas Kleines mit deinen Händen, einfach aus Freude.
  - id: herrscher
    motto: Verantwortung tragen
    icon: crown
    name: Herrscher
    phase: Rückkehr
    stone: Lapislazuli
    color: "#2f4f8f"
    essence: Du übernimmst Verantwortung und schaffst eine Ordnung, in der sich andere sicher fühlen.
    drive: Ordnung und Verantwortung
    gift: Souveränität und Überblick. Du gibst Struktur und Orientierung.
    shadow: Aus Verantwortung kann der Wunsch werden, alles zu lenken.
    question: Wo darf ich führen, wo darf ich vertrauen?
    invite: Bring einen Bereich deines Lebens in Ordnung und triff eine klare Entscheidung.
  - id: magier
    motto: Wandlung bewirken
    icon: spark
    name: Magier
    phase: Rückkehr
    stone: Amethyst
    color: "#8a5aa8"
    essence: Du spürst, wie sich durch Bewusstsein die Wirklichkeit verwandelt.
    drive: Wandlung durch Bewusstsein
    gift: Inspiration und Verwandlungskraft. Du entdeckst Möglichkeiten, wo andere Grenzen sehen.
    shadow: Diese Kraft möchte achtsam eingesetzt werden, im Einklang mit anderen.
    question: Welche Sichtweise verwandelt meine Lage?
    invite: Betrachte eine festgefahrene Situation heute bewusst aus einem neuen Blickwinkel.
  - id: weiser
    motto: Wahrheit erkennen
    icon: owl
    name: Weiser
    phase: Rückkehr
    stone: Jade
    color: "#5f8f64"
    essence: Du suchst die Wahrheit und schaust mit Klarheit auf das Leben.
    drive: Wahrheit und Erkenntnis
    gift: Klarheit und Gelassenheit. Dein Rat ist anderen kostbar.
    shadow: Viel Nachdenken kann dich vom Erleben entfernen.
    question: Was weiß ich tief in mir schon längst?
    invite: Nimm dir eine stille Viertelstunde und lausche deiner inneren Stimme.
  - id: narr
    motto: Leicht durchs Leben
    icon: jester
    name: Narr
    phase: Rückkehr
    stone: Sonnenstein
    color: "#e07b39"
    essence: Du lebst im Moment und bringst Leichtigkeit und Lachen in die Welt.
    drive: Lebensfreude im Moment
    gift: Leichtigkeit und Humor. Mit dir wird selbst Schweres heller.
    shadow: Hinter der Leichtigkeit verstecken sich manchmal tiefere Gefühle.
    question: Wo darf mehr Spiel in mein Leben?
    invite: Mach heute etwas Verspieltes, einfach aus Freude.

questions:
  - q: "Welches Bild würdest du dir an die Wand hängen?"
    a:
      - [rebell, "Ein Gewitter, das über die Berge zieht"]
      - [liebender, "Zwei Hände, die sich im Abendlicht berühren"]
      - [herrscher, "Eine alte Burg, die seit Jahrhunderten über dem Tal wacht"]
      - [narr, "Kinder, die lachend durch eine Pfütze springen"]
  - q: "Ein gutes Gespräch erkennst du daran, dass …"
    a:
      - [unschuldiger, "… du danach wieder fest an das Gute glaubst."]
      - [weggefaehrte, "… ihr ehrlich und auf Augenhöhe gesprochen habt."]
      - [krieger, "… am Ende ein klarer nächster Schritt feststeht."]
      - [magier, "… plötzlich alles in einem neuen Licht erscheint."]
  - q: "Der Sonntag fühlt sich gelungen an, weil …"
    a:
      - [fuersorgender, "… sich die Menschen um dich herum wohlgefühlt haben."]
      - [entdecker, "… du etwas Unbekanntes entdeckt hast."]
      - [schoepfer, "… unter deinen Händen etwas Eigenes entstanden ist."]
      - [weiser, "… du etwas tiefer verstanden hast."]
  - q: "Ein freier Nachmittag wird dir geschenkt. Am meisten reizt dich …"
    a:
      - [krieger, "… eine lange Bergtour, die dich so richtig fordert."]
      - [fuersorgender, "… ein Besuch bei jemandem, der sich riesig darüber freut."]
      - [liebender, "… ein Nachmittag zu zweit, an dem die Zeit stillsteht."]
      - [schoepfer, "… ein Vorhaben, an dem du schon lange tüfteln möchtest."]
  - q: "Welches Tier fühlt sich gerade wie ein Begleiter an?"
    a:
      - [rebell, "Die Schlange, die ihre alte Haut abstreift"]
      - [magier, "Der Rabe, der zwischen den Welten fliegt"]
      - [weiser, "Die Eule, die auch im Dunkeln klar sieht"]
      - [narr, "Der Otter, der verspielt durch den Fluss treibt"]
  - q: "Du ziehst an einen neuen Ort. In den ersten Wochen …"
    a:
      - [unschuldiger, "… genießt du den Zauber des Anfangs."]
      - [weggefaehrte, "… lernst du die Nachbarn kennen und findest deine Leute."]
      - [entdecker, "… erkundest du jeden Pfad und jeden versteckten Winkel."]
      - [herrscher, "… richtest du alles so ein, dass es auf Dauer trägt."]
  - q: "Ein Abend wird unvergesslich, wenn …"
    a:
      - [unschuldiger, "… alles leicht und heiter ist, wie früher als Kind."]
      - [fuersorgender, "… jeder Gast mit einem Lächeln nach Hause geht."]
      - [liebender, "… ein Gespräch so tief wird, dass alles andere verblasst."]
      - [magier, "… sich etwas fügt, das niemand geplant hat."]
  - q: "Du hast ein ganzes Jahr frei. Du verbringst es …"
    a:
      - [krieger, "… mit einem großen Ziel, auf das du Tag für Tag hinarbeitest."]
      - [entdecker, "… mit einem Rucksack und einer Landkarte voller weißer Flecken."]
      - [weiser, "… mit Büchern, Lehrern und viel Zeit zum Nachdenken."]
      - [narr, "… genau so, wie jeder neue Morgen es dir vorschlägt."]
  - q: "Etwas in deinem Leben fühlt sich unstimmig an. Was hilft dir am meisten?"
    a:
      - [weggefaehrte, "Mit jemandem reden, der so etwas selbst kennt."]
      - [rebell, "Einen klaren Schnitt machen und Platz schaffen."]
      - [schoepfer, "Ein ganz neues Bild davon entwerfen, wie es sein könnte."]
      - [herrscher, "Mir einen Überblick verschaffen und entscheiden."]
  - q: "In einer Freundschaft ist dir am wichtigsten, …"
    a:
      - [weggefaehrte, "… dass man sich aufeinander verlassen kann."]
      - [entdecker, "… dass jeder seine eigenen Wege gehen darf."]
      - [liebender, "… dass man sich ganz nah sein kann."]
      - [narr, "… dass man miteinander albern sein kann."]
  - q: "In einem gemeinsamen Vorhaben bist du am liebsten die Person, die …"
    a:
      - [krieger, "… dranbleibt, wenn es schwierig wird."]
      - [schoepfer, "… die erste Skizze aufs leere Blatt bringt."]
      - [herrscher, "… alle Fäden in der Hand behält."]
      - [magier, "… den Funken überspringen lässt."]
  - q: "Eine schwere Nachricht erreicht dich. Was gibt dir als Erstes Halt?"
    a:
      - [unschuldiger, "Das Vertrauen, dass auch darin etwas Gutes liegt."]
      - [fuersorgender, "Für die da zu sein, die es ebenso trifft."]
      - [rebell, "Das Gefühl, dass jetzt etwas Neues beginnen darf."]
      - [weiser, "Die Ruhe, um zu verstehen, was geschehen ist."]
  - q: "Welcher Ort zieht dich gerade am meisten an?"
    a:
      - [entdecker, "Ein Hafen, von dem Schiffe in die Ferne aufbrechen"]
      - [rebell, "Eine Lichtung nach dem Sturm, voller junger Triebe"]
      - [schoepfer, "Eine Werkstatt voller Material und halbfertiger Ideen"]
      - [magier, "Ein alter Steinkreis in der Morgendämmerung"]
  - q: "Welches Licht magst du am liebsten?"
    a:
      - [unschuldiger, "Das erste Morgenlicht, wenn der Tag noch ganz frisch ist"]
      - [liebender, "Kerzenschein, warm und nah"]
      - [herrscher, "Das klare Mittagslicht, in dem alles deutlich zu sehen ist"]
      - [weiser, "Die Dämmerung, wenn die Welt still wird"]
  - q: "Auf einer Wanderung zieht plötzlich ein Gewitter auf."
    a:
      - [weggefaehrte, "Du achtest darauf, dass alle zusammenbleiben."]
      - [krieger, "Du gehst voran und findest den schnellsten Weg ins Trockene."]
      - [fuersorgender, "Du teilst deine Jacke mit dem, der am meisten friert."]
      - [narr, "Du stimmst ein Lied an, und es wird ein Abenteuer."]
  - q: "Ein Tag war gut, wenn …"
    a:
      - [fuersorgender, "… jemand durch dich ein wenig leichter durch den Tag kam."]
      - [herrscher, "… du am Abend weißt, dass alles in guten Händen liegt."]
      - [magier, "… sich ein kleines Wunder ereignet hat."]
      - [narr, "… du so gelacht hast, dass dir die Tränen kamen."]
  - q: "Jemand stellt deine Überzeugung in Frage."
    a:
      - [unschuldiger, "Du hörst freundlich zu und vertraust auf seine gute Absicht."]
      - [krieger, "Du stehst zu deiner Sicht und vertrittst sie mit klaren Worten."]
      - [entdecker, "Du nimmst die Frage mit auf deinen Weg und prüfst sie für dich."]
      - [rebell, "Du nimmst gleich die Regeln dahinter mit unter die Lupe."]
  - q: "Welches Geschenk würde dich am meisten freuen?"
    a:
      - [weggefaehrte, "Ein Abend am Lagerfeuer mit alten Freunden"]
      - [liebender, "Ein Wochenende zu zweit an einem schönen Ort"]
      - [schoepfer, "Ein Werkzeug, mit dem du etwas Eigenes bauen kannst"]
      - [weiser, "Ein Gespräch mit einem Menschen, der viel erlebt hat"]
  - q: "Wenn du an die kommende Zeit denkst, wünschst du dir vor allem …"
    part: sehnsucht
    a:
      - [unschuldiger, "… mehr Leichtigkeit und Vertrauen ins Leben."]
      - [entdecker, "… einen Aufbruch zu neuen Horizonten."]
      - [herrscher, "… mehr Klarheit und festen Boden unter den Füßen."]
      - [liebender, "… mehr Nähe und Herzenswärme."]
  - q: "Welcher Satz berührt dich gerade?"
    part: sehnsucht
    a:
      - [weggefaehrte, "Ich möchte irgendwo ganz dazugehören."]
      - [rebell, "Ich möchte etwas Altes endlich hinter mir lassen."]
      - [magier, "Ich möchte erleben, wie sich Dinge wie von selbst fügen."]
      - [fuersorgender, "Ich möchte mit dem, was ich gebe, etwas bewirken."]
  - q: "Welche Kraft würdest du dir gerade gern ausleihen?"
    part: sehnsucht
    a:
      - [krieger, "Die Ausdauer, die bis zum Gipfel trägt"]
      - [schoepfer, "Die Schaffenskraft, die aus einer Idee ein Werk macht"]
      - [weiser, "Die Gelassenheit, die das große Ganze sieht"]
      - [narr, "Die Unbeschwertheit, die jeden Moment zum Spiel macht"]
  - q: "Welches Bild ruft dich gerade?"
    part: sehnsucht
    a:
      - [unschuldiger, "Eine Blumenwiese im ersten Frühlingslicht"]
      - [rebell, "Ein Feuer, in dem Altes zu Asche wird"]
      - [weiser, "Ein stiller Bergsee, in dem sich der Himmel spiegelt"]
      - [krieger, "Ein Gipfel, im Morgengrauen erreicht"]
  - q: "Wenn dir drei Monate geschenkt würden, würdest du …"
    part: sehnsucht
    a:
      - [weggefaehrte, "… sie mit Menschen verbringen, bei denen du ganz du selbst bist."]
      - [entdecker, "… losziehen und schauen, wohin der Weg dich führt."]
      - [schoepfer, "… das erschaffen, was schon so lange in dir wartet."]
      - [narr, "… jeden Tag nehmen, wie er kommt, und das Leben feiern."]
  - q: "Was würde deinem Leben gerade guttun?"
    part: sehnsucht
    a:
      - [fuersorgender, "Eine Aufgabe, bei der du für andere da sein kannst"]
      - [liebender, "Mehr Leidenschaft und Sinnlichkeit im Alltag"]
      - [herrscher, "Ein eigener Bereich, für den du Verantwortung trägst"]
      - [magier, "Ein Wandel, der dich von innen heraus verwandelt"]
