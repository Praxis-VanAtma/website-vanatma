# Archetypen-Kreis – zwölf Archetypen nach Carol S. Pearson, eigene Situationen.
# Auswertung: „am ehesten“ +2, „am wenigsten“ −1. Jeder Archetyp kommt genau sechsmal vor.
# Reihenfolge der Archetypen = Reihenfolge im Rad (je vier pro Phase: Vorbereitung, Reise, Rückkehr).

phases:
  - name: Vorbereitung
    motto: Wurzeln schlagen
    color: "#c9b48a"
  - name: Reise
    motto: Dich selbst finden
    color: "#8fae8a"
  - name: Rückkehr
    motto: Dein Licht teilen
    color: "#a99bc4"

archetypes:
  - id: unschuldiger
    motto: Vertrauen ins Leben
    icon: sun
    name: Unschuldiger
    phase: Vorbereitung
    stone: Bergkristall
    color: "#cfd8dc"
    essence: Du begegnest dem Leben mit Vertrauen und einem offenen Herzen.
    drive: Vertrauen und Geborgenheit
    gift: Zuversicht und Optimismus. Du siehst das Gute und steckst andere damit an.
    shadow: Wenn es schwer wird, schaust du manchmal lieber weg.
    question: Wo darf ich heute einfach vertrauen?
    invite: Schenk dir jeden Tag einen Moment kindlicher Freude und Zuversicht.
  - id: weggefaehrte
    motto: Gemeinsam stark
    icon: rings
    name: Weggefährte
    alt: Waise
    phase: Vorbereitung
    stone: Achat
    color: "#a07a52"
    essence: Du weißt, wie wertvoll Zusammenhalt ist, und stehst mit beiden Beinen auf der Erde.
    drive: Zugehörigkeit und Verbundenheit
    gift: Mitgefühl und Bodenhaftung. Bei dir fühlen sich Menschen verstanden.
    shadow: In schweren Zeiten kann das Gefühl wachsen, allein dazustehen.
    question: Wer geht meinen Weg mit mir?
    invite: Bitte jemanden um Unterstützung und genieße das Miteinander.
  - id: krieger
    motto: Mutig einstehen
    icon: shield
    name: Krieger
    alt: Held
    phase: Vorbereitung
    stone: Karneol
    color: "#c0532f"
    essence: Du setzt dich mutig für das ein, was dir wichtig ist.
    drive: Mut und Durchsetzung
    gift: Entschlossenheit und Disziplin. Du bringst Dinge ins Ziel und schützt, was dir am Herzen liegt.
    shadow: Manchmal wird aus Stärke Härte, gegen andere oder gegen dich selbst.
    question: Wofür lohnt es sich für mich einzustehen?
    invite: Setz dir ein kleines, klares Ziel und geh es heute entschlossen an.
  - id: fuersorgender
    motto: Für andere da sein
    icon: bowl
    name: Fürsorgender
    phase: Vorbereitung
    stone: Rosenquarz
    color: "#e2a6ad"
    essence: Du schenkst anderen Wärme, Halt und Zuwendung.
    drive: Für andere da sein
    gift: Großzügigkeit und Wärme. In deiner Nähe blühen Menschen auf.
    shadow: Dabei gerätst du selbst leicht aus dem Blick.
    question: Wie sorge ich heute auch für mich?
    invite: Schenk heute jemandem bewusst eine kleine Freundlichkeit, und dir selbst ebenso.
  - id: entdecker
    motto: Neugierig aufbrechen
    icon: compass
    name: Entdecker
    alt: Suchender
    phase: Reise
    stone: Türkis
    color: "#3e9c96"
    essence: Du folgst deiner Neugier und suchst den Weg, der wirklich deiner ist.
    drive: Freiheit und das eigene Selbst finden
    gift: Neugier und Unabhängigkeit. Du öffnest Türen zu neuen Welten.
    shadow: Die Sehnsucht nach dem Nächsten kann rastlos machen.
    question: Wonach sehnt sich meine Seele gerade?
    invite: Geh einen ganz neuen Weg, mit offenen Sinnen und frei im Herzen.
  - id: rebell
    motto: Altes loslassen
    icon: bolt
    name: Rebell
    alt: Zerstörer
    phase: Reise
    stone: Onyx
    color: "#3b3a3f"
    essence: Du hast den Mut, loszulassen und Altes zu verwandeln.
    drive: Loslassen und Wandlung
    gift: Mut zur Veränderung. Du räumst auf und schaffst Raum für Neues.
    shadow: Manchmal reißt du ein, was dich noch tragen könnte.
    question: Was darf in meinem Leben gehen?
    invite: Verabschiede bewusst eine Sache, die ausgedient hat.
  - id: liebender
    motto: Mit Hingabe leben
    icon: heart
    name: Liebender
    phase: Reise
    stone: Granat
    color: "#8e2a3c"
    essence: Du lebst mit Hingabe und spürst tiefe Verbundenheit.
    drive: Nähe und Hingabe
    gift: Leidenschaft und Herzensverbindung. Du schenkst dem Leben Schönheit und Wärme.
    shadow: In der Nähe zu anderen kannst du dich selbst verlieren.
    question: Wem oder was schenke ich mein Herz?
    invite: Genieße heute etwas mit allen Sinnen, Musik, Essen, Natur oder einen lieben Menschen.
  - id: schoepfer
    motto: Neues erschaffen
    icon: spiral
    name: Schöpfer
    phase: Reise
    stone: Citrin
    color: "#e0b23c"
    essence: Du bringst Neues in die Welt und gibst ihm deine Handschrift.
    drive: Etwas Eigenes erschaffen
    gift: Kreativität und Vision. Aus Ideen wird bei dir Wirklichkeit.
    shadow: Der eigene Anspruch kann zu Perfektionismus werden.
    question: Was möchte durch mich in die Welt?
    invite: Erschaffe etwas Kleines mit deinen Händen, einfach aus Freude.
  - id: herrscher
    motto: Verantwortung tragen
    icon: crown
    name: Herrscher
    phase: Rückkehr
    stone: Lapislazuli
    color: "#2f4f8f"
    essence: Du übernimmst Verantwortung und schaffst eine Ordnung, in der sich andere sicher fühlen.
    drive: Ordnung und Verantwortung
    gift: Souveränität und Überblick. Du gibst Struktur und Orientierung.
    shadow: Aus Verantwortung kann der Wunsch werden, alles zu lenken.
    question: Wo darf ich führen, wo darf ich vertrauen?
    invite: Bring einen Bereich deines Lebens in Ordnung und triff eine klare Entscheidung.
  - id: magier
    motto: Wandlung bewirken
    icon: spark
    name: Magier
    phase: Rückkehr
    stone: Amethyst
    color: "#8a5aa8"
    essence: Du spürst, wie sich durch Bewusstsein die Wirklichkeit verwandelt.
    drive: Wandlung durch Bewusstsein
    gift: Inspiration und Verwandlungskraft. Du entdeckst Möglichkeiten, wo andere Grenzen sehen.
    shadow: Diese Kraft möchte achtsam eingesetzt werden, im Einklang mit anderen.
    question: Welche Sichtweise verwandelt meine Lage?
    invite: Betrachte eine festgefahrene Situation heute bewusst aus einem neuen Blickwinkel.
  - id: weiser
    motto: Wahrheit erkennen
    icon: owl
    name: Weiser
    phase: Rückkehr
    stone: Jade
    color: "#5f8f64"
    essence: Du suchst die Wahrheit und schaust mit Klarheit auf das Leben.
    drive: Wahrheit und Erkenntnis
    gift: Klarheit und Gelassenheit. Dein Rat ist anderen kostbar.
    shadow: Viel Nachdenken kann dich vom Erleben entfernen.
    question: Was weiß ich tief in mir schon längst?
    invite: Nimm dir eine stille Viertelstunde und lausche deiner inneren Stimme.
  - id: narr
    motto: Leicht durchs Leben
    icon: jester
    name: Narr
    phase: Rückkehr
    stone: Sonnenstein
    color: "#e07b39"
    essence: Du lebst im Moment und bringst Leichtigkeit und Lachen in die Welt.
    drive: Lebensfreude im Moment
    gift: Leichtigkeit und Humor. Mit dir wird selbst Schweres heller.
    shadow: Hinter der Leichtigkeit verstecken sich manchmal tiefere Gefühle.
    question: Wo darf mehr Spiel in mein Leben?
    invite: Mach heute etwas Verspieltes, einfach aus Freude.

questions:
  - q: Ein Lebensabschnitt geht zu Ende. Was tust du?
    a:
      - [rebell, "Ich lasse bewusst los, was ausgedient hat, und mache Platz für Neues."]
      - [liebender, "Ich verbringe die Zeit mit den Menschen, die mir am Herzen liegen."]
      - [herrscher, "Ich ordne alles in Ruhe, übergebe sauber und plane den nächsten Abschnitt."]
      - [narr, "Ich feiere den Abschied mit einem Fest und einem Augenzwinkern."]
  - q: Vor dir liegt eine schwierige Aufgabe.
    a:
      - [unschuldiger, "Ich vertraue darauf, dass sich alles gut fügt, und gehe zuversichtlich los."]
      - [weggefaehrte, "Ich hole mir Menschen an die Seite, denen es ähnlich geht, gemeinsam geht es leichter."]
      - [krieger, "Ich setze mir ein klares Ziel und arbeite mich Schritt für Schritt durch."]
      - [magier, "Ich suche den Blickwinkel, aus dem sich die Aufgabe plötzlich verwandelt."]
  - q: Ein freier Sonntag liegt vor dir.
    a:
      - [fuersorgender, "Ich koche für die Familie oder besuche jemanden, der sich über Gesellschaft freut."]
      - [entdecker, "Ich wandere einen ganz neuen Weg und schaue, wohin er mich führt."]
      - [schoepfer, "Ich vertiefe mich in ein eigenes Projekt: malen, bauen, schreiben, gärtnern."]
      - [weiser, "Ich lese in Ruhe ein gutes Buch und denke über das Gelesene nach."]
  - q: Ein Mensch, der dir nahesteht, steckt in einer Krise.
    a:
      - [krieger, "Ich stelle mich an seine Seite und setze mich entschlossen für ihn ein."]
      - [fuersorgender, "Ich kümmere mich um ihn, höre zu und nehme ihm Lasten ab."]
      - [liebender, "Ich bin ganz bei ihm und zeige ihm, wie wertvoll er mir ist."]
      - [schoepfer, "Ich entwickle mit ihm eine Idee, wie es neu weitergehen kann."]
  - q: Im Wald begegnet dir eine alte, umgestürzte Eiche.
    a:
      - [rebell, "Ich spüre: Aus dem, was fällt, wächst Neues."]
      - [magier, "Ich lege die Hand auf das Holz und spüre die Kraft, die sich hier verwandelt."]
      - [weiser, "Ich betrachte die Jahresringe und frage mich, was dieser Baum alles erlebt hat."]
      - [narr, "Ich balanciere über den Stamm und freue mich wie ein Kind."]
  - q: Du ziehst an einen neuen Ort.
    a:
      - [unschuldiger, "Ich gehe offen und voller Vertrauen auf die Nachbarn zu."]
      - [weggefaehrte, "Ich suche schnell Anschluss, eine Runde, in der ich dazugehöre."]
      - [entdecker, "Ich erkunde jeden Winkel, jeden Pfad und jeden Aussichtspunkt."]
      - [herrscher, "Ich richte mich gut ein und übernehme bald eine Aufgabe in der Gemeinschaft."]
  - q: Was berührt dich an einem Fest am meisten?
    a:
      - [unschuldiger, "Die heitere Stimmung, in der alles leicht und gut ist."]
      - [fuersorgender, "Zu sehen, dass alle versorgt sind und sich wohlfühlen."]
      - [liebender, "Die innigen Gespräche von Herz zu Herz."]
      - [magier, "Der Moment, in dem eine Runde plötzlich zu etwas Größerem wird."]
  - q: Du darfst ein Jahr lang etwas Neues lernen.
    a:
      - [krieger, "Etwas, das mich fordert und an meine Grenzen bringt, etwa eine Kampfkunst."]
      - [entdecker, "Eine fremde Kultur, am liebsten direkt vor Ort."]
      - [weiser, "Ein Fachgebiet, das ich wirklich in der Tiefe verstehen möchte."]
      - [narr, "Etwas Verspieltes wie Improtheater, Jonglieren oder Tanzen."]
  - q: Etwas in deinem Leben fühlt sich schon lange unstimmig an.
    a:
      - [weggefaehrte, "Ich schaue ehrlich hin, nehme die Lage an, wie sie ist, und hole mir Rat."]
      - [rebell, "Ich räume gründlich auf und beende, was mich bindet."]
      - [schoepfer, "Ich entwerfe mein Leben neu, wie ein Bild auf leerer Leinwand."]
      - [herrscher, "Ich übernehme Verantwortung, treffe eine Entscheidung und setze sie um."]
  - q: Was wünschst du dir von einer Freundschaft am meisten?
    a:
      - [weggefaehrte, "Verlässlichkeit: dass wir in schweren Zeiten füreinander da sind."]
      - [entdecker, "Freiheit: dass jede und jeder den eigenen Weg gehen darf."]
      - [liebender, "Tiefe: dass wir einander ganz nah sind."]
      - [narr, "Leichtigkeit: dass wir miteinander lachen können."]
  - q: In einer Gruppe steht ein gemeinsames Projekt an.
    a:
      - [krieger, "Ich packe an und sorge mit Ausdauer dafür, dass wir ankommen."]
      - [schoepfer, "Ich bringe die zündende Idee ein und gestalte sie aus."]
      - [herrscher, "Ich übernehme die Leitung, verteile Aufgaben und behalte den Überblick."]
      - [magier, "Ich schaffe einen Rahmen, in dem Unerwartetes möglich wird."]
  - q: Du bekommst eine schwere Nachricht.
    a:
      - [unschuldiger, "Ich halte mich an mein Vertrauen, dass auch darin etwas Gutes liegt."]
      - [fuersorgender, "Ich denke zuerst an die anderen und schaue, wie es ihnen damit geht."]
      - [rebell, "Ich lasse den Schmerz zu und erlaube, dass sich etwas in mir wandelt."]
      - [weiser, "Ich ziehe mich zurück, sortiere die Fakten und suche nach dem Sinn."]
  - q: Wenn du an deinen Lebenstraum denkst …
    a:
      - [entdecker, "… sehe ich ein Leben unterwegs, in dem ich mich immer wieder neu entdecke."]
      - [rebell, "… sehe ich ein Leben, das alte Muster hinter sich gelassen hat und frei atmet."]
      - [schoepfer, "… sehe ich ein Werk, das meine Handschrift trägt und bleibt."]
      - [magier, "… sehe ich, wie Träume Wirklichkeit werden, für mich und andere."]
  - q: Was macht für dich ein gutes Zuhause aus?
    a:
      - [unschuldiger, "Geborgenheit, ein Ort, an dem die Welt heil ist."]
      - [liebender, "Schönheit, Sinnlichkeit und viel Wärme."]
      - [herrscher, "Klare Strukturen, alles hat seinen Platz."]
      - [weiser, "Ruhe, Bücher und Raum zum Nachdenken."]
  - q: Auf einer Wanderung zieht ein Gewitter auf.
    a:
      - [weggefaehrte, "Ich sorge dafür, dass wir als Gruppe zusammenbleiben."]
      - [krieger, "Ich übernehme die Führung und bringe alle zügig in Sicherheit."]
      - [fuersorgender, "Ich kümmere mich um die, die sich fürchten oder frieren."]
      - [narr, "Ich bringe mit einem Lied oder einem Witz alle zum Lachen, bis der Regen vorbei ist."]
  - q: Woran erkennst du einen gelungenen Tag?
    a:
      - [fuersorgender, "Ich konnte jemandem helfen."]
      - [herrscher, "Ich habe Wichtiges erledigt und gute Entscheidungen getroffen."]
      - [magier, "Etwas hat sich wie von selbst gefügt, kleine Wunder inklusive."]
      - [narr, "Ich habe herzlich gelacht und den Moment genossen."]
  - q: Jemand stellt deine Überzeugung in Frage.
    a:
      - [unschuldiger, "Ich bleibe freundlich und glaube an seine gute Absicht."]
      - [krieger, "Ich stehe für meine Überzeugung ein und argumentiere klar."]
      - [entdecker, "Ich nehme es als Anlass, meinen eigenen Weg neu zu prüfen."]
      - [rebell, "Ich stelle gleich auch die Regeln dahinter in Frage."]
  - q: Welches Geschenk würde dich am meisten freuen?
    a:
      - [weggefaehrte, "Ein Abend mit guten Freunden, an dem ich einfach dazugehöre."]
      - [liebender, "Ein Wochenende zu zweit mit einem geliebten Menschen."]
      - [schoepfer, "Material und Zeit für ein eigenes kreatives Projekt."]
      - [weiser, "Ein Kurs bei einer inspirierenden Lehrerin oder einem inspirierenden Lehrer."]
