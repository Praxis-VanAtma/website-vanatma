faq:
  - q: Was bedeutet der Name VanAtma?
    a: VanAtma bedeutet für uns der Atem der Seele auf Reisen. „Atma" stammt aus dem Sanskrit und steht für das innere Selbst, „Van" für Bewegung, Reise und Freiheit.
  - q: Wer arbeitet in der Praxis?
    a: Dr. med. Stefanie Klappenberger ist Ärztin und verantwortet alle medizinischen Angebote wie IHHT, Eigenbluttherapie, Akupunktur und sanfte Ästhetik. Stephan Dietl begleitet mit schamanischer Arbeit, feiner Energiearbeit und Hypnose und betreut die IHHT-Sitzungen.
  - q: Wie bekomme ich einen Termin?
    a: Termine vergeben wir nach Vereinbarung. Schreib uns über das Kontaktformular oder an praxis@vanatma.de, oder ruf uns an. Wir melden uns persönlich bei dir.
  - q: Wie wird abgerechnet?
    a: Als Privatpraxis rechnen wir mit Privatversicherten und Selbstzahlern ab. Die Kosten besprechen wir vorab persönlich mit dir.
  - q: Erstattet meine Krankenversicherung die Kosten?
    a: Manche private Krankenversicherungen erstatten einzelne Leistungen ganz oder teilweise, zum Beispiel IHHT-Anwendungen. Das hängt von deinem Tarif ab. Frag am besten vorab bei deiner Versicherung nach.
  - q: Wie läuft der Einstieg bei IHHT ab?
    a: Jedes IHHT-Programm beginnt mit einem ärztlichen Erstgespräch und einer Anamnese bei Dr. med. Stefanie Klappenberger. Ab dem zweiten Besuch begleitet dich Stephan durch die Sitzungen.
  - q: Wie verhalten sich Energiearbeit und Medizin zueinander?
    a: Schamanische Begleitung, Reiki und Hypnose sind Angebote für dein Wohlbefinden und deine persönliche Entwicklung. Sie ersetzen keine ärztliche oder psychotherapeutische Behandlung. Bei uns dürfen beide Wege einander ergänzen.
  - q: Was erwartet mich bei einem Retreat?
    a: Unsere Retreats sind Tage der Stille im Bayerischen Wald, mit Waldwegen, Meditationen, Ritualen, gesundem Essen und Impulsen für deinen Weg. Die aktuellen Termine findest du auf der Seite Veranstaltungen.
  - q: Gibt es Gutscheine?
    a: Ja, für viele Angebote und Veranstaltungen stellen wir Gutscheine aus. Wir fragen dabei nach dem Verwendungszweck und laden die beschenkte Person gern zu einem kurzen Vorgespräch ein, damit das Geschenk wirklich passt.
  - q: Wo finde ich die Praxis?
    a: Unsere Praxis liegt im Bayerweg 57 in 94379 Sankt Englmar, mitten im Bayerischen Wald auf rund 900 Metern. Aus Straubing, Bogen, Deggendorf, Regen und Cham bist du schnell bei uns.
