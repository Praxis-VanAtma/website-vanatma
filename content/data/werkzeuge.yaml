# Werkzeuge zur Selbstreflexion – Übersicht unter /werkzeuge/
tools:
  - slug: lebensblume
    title: Lebensblume
    eyebrow: Wo stehst du gerade?
    text: Neun Blütenblätter, neun Bereiche deines Lebens. Schau, wo deine Blume schon voll blüht und wo sie wachsen möchte, und halte deine nächsten Schritte fest.
    time: etwa 5 bis 10 Minuten
    art: blume
  - slug: wertesternbild
    title: Wertesternbild
    eyebrow: Was ist dir wirklich wichtig?
    text: Wähle sieben Werte und entscheide im Abgleich, was dir wichtiger ist. Am Ende leuchten deine Werte als echtes Sternbild über dem Bayerischen Wald.
    time: etwa 5 Minuten
    art: sterne
  - slug: archetypen-kreis
    title: Archetypen-Kreis
    eyebrow: Welche Kräfte wirken in dir?
    text: Zwölf Archetypen, aufgereiht wie Perlen. In 18 kleinen Alltagsszenen entdeckst du, welche drei in dir am stärksten leuchten.
    time: etwa 5 bis 7 Minuten
    art: perlen
